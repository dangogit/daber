name: "Release"

on: workflow_dispatch

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${{ steps.get-version.outputs.version }}`,
              name: `v${{ steps.get-version.outputs.version }}`,
              draft: true,
              prerelease: false,
              generate_release_notes: true
            })
            return data.id

  publish-tauri:
    permissions:
      contents: write
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26" # for Arm based macs (M1 and above). Uses macOS 26 for Apple Intelligence SDK.
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "macos-latest" # for Intel based macs.
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
          - platform: "ubuntu-22.04" # Build .deb on 22.04
            args: "--bundles deb"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04" # Build AppImage and RPM on 24.04
            args: "--bundles appimage,rpm"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04-arm" # Build for ARM64 Linux
            args: "--bundles appimage,deb,rpm"
            target: "aarch64-unknown-linux-gnu"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"
          - platform: "windows-11-arm" # for ARM64 Windows runner
            args: "--target aarch64-pc-windows-msvc"
            target: "aarch64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: true
      asset-prefix: "dibur"
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
      # Releases always build from scratch — never restore the Rust cache, so a
      # stale cached native lib can never be linked into a shipped artifact.
      no-cache: true
    secrets: inherit

  # tauri-action writes latest.json once per matrix job, each time by reading the
  # copy already on the release and merging its own platform into it. That works,
  # but it is a read-modify-write from seven parallel jobs against one file, and
  # the read is capped at 50 assets. Either way it fails by producing a manifest
  # that is merely incomplete, which an app in the field cannot tell apart from
  # "no update for my platform". So the manifest is checked before anyone ships.
  verify-updater-manifest:
    permissions:
      # `write`, not `read`: the release is still a draft at this point, and a
      # draft's assets are invisible to a read-scoped token. It fails as
      # `Resource not accessible by integration (HTTP 403)`, which reads like a
      # missing secret rather than a scope that is one word too narrow.
      contents: write
    needs: [create-release, publish-tauri]
    runs-on: ubuntu-latest
    steps:
      - name: Every platform is present in latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          asset_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
            --paginate --jq '.[] | select(.name == "latest.json") | .id' | head -1)
          if [ -z "$asset_id" ]; then
            echo "::error::latest.json was never uploaded. The updater is configured but this release cannot serve it."
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
            -H "Accept: application/octet-stream" > latest.json
          echo "--- latest.json ---"; cat latest.json; echo

          missing=0
          for key in darwin-aarch64 darwin-x86_64 windows-x86_64 windows-aarch64 \
                     linux-x86_64 linux-aarch64; do
            if ! jq -e --arg k "$key" '.platforms[$k].url and .platforms[$k].signature' latest.json >/dev/null; then
              echo "::error::latest.json has no usable entry for $key"
              missing=1
            fi
          done

          manifest_version=$(jq -r .version latest.json)
          if [ "$manifest_version" != "$VERSION" ]; then
            echo "::error::latest.json says version $manifest_version but this release is $VERSION"
            missing=1
          fi

          [ "$missing" -eq 0 ] || exit 1
          echo "latest.json covers every platform at version $VERSION"

  publish-release:
    permissions:
      contents: write
    needs: [create-release, verify-updater-manifest]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq .draft)" = "false"
          echo "Published release ${{ needs.create-release.outputs.version }}."
